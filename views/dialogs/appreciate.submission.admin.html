<md-dialog class="dialog-width">
    <form name="appreciationForm" ng-submit="save()">
        <md-toolbar>
            <div class="md-toolbar-tools">
                <h2>{{ 'Appreciation' | translate }} : {{ submission.clientName }} - {{ 'Version' | translate }} {{ submission.version }}</h2>
                <span flex></span>
                <md-button class="md-icon-button" ng-click="cancel()">
                    <md-icon aria-label="{{ 'Close dialog' | translate }}">close</md-icon>
                </md-button>
            </div>
        </md-toolbar>
        <md-dialog-content>
            <div class="md-dialog-content">
                <md-input-container class="md-block">
                    <label translate>Level</label>
                    <md-select ng-model="appreciation.level" name="level" required>
                        <md-option value="insufficient" translate>Insufficient</md-option>
                        <md-option value="to_improve" translate>To improve</md-option>
                        <md-option value="satisfactory" translate>Satisfactory</md-option>
                        <md-option value="very_satisfactory" translate>Very satisfactory</md-option>
                    </md-select>
                    <div ng-messages="appreciationForm.level.$error">
                        <div ng-message="required">{{ 'Choose a level' | translate }}</div>
                    </div>
                </md-input-container>

                <md-input-container class="md-block">
                    <label translate>Comment</label>
                    <textarea ng-model="appreciation.comment" name="comment" rows="5" maxlength="5000"></textarea>
                </md-input-container>
            </div>
        </md-dialog-content>
        <md-dialog-actions>
            <md-button ng-click="cancel()" translate>Cancel</md-button>
            <md-button type="submit" class="md-primary md-raised" ng-disabled="appreciationForm.$invalid || isSaving" translate>Save</md-button>
        </md-dialog-actions>
    </form>
</md-dialog>
