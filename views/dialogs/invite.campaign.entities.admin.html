<md-dialog class="dialog-width">
    <form name="inviteForm">
        <md-toolbar>
            <div class="md-toolbar-tools">
                <h2 translate>Invite entities</h2>
                <span flex></span>
                <md-button class="md-icon-button" ng-click="cancel()">
                    <md-icon aria-label="{{ 'Close dialog' | translate }}">close</md-icon>
                </md-button>
            </div>
        </md-toolbar>
        <md-dialog-content>
            <div class="md-dialog-content">
                <p class="md-caption" translate>The invited entities get the dates of the campaign and receive the invitation by email. They can participate until the end of the campaign.</p>
                <md-chips ng-model="clients" md-require-match="true" md-autocomplete-snap>
                    <md-autocomplete
                            md-no-cache="true"
                            md-search-text="clientSearchText"
                            md-items="client in searchClients(clientSearchText)"
                            md-item-text="client.name"
                            md-min-length="0"
                            placeholder="+ {{ 'Invite an entity' | translate }}">
                        <span md-highlight-text="clientSearchText" md-highlight-flags="i">{{ client.name }}</span>
                    </md-autocomplete>
                    <md-chip-template>{{ $chip.name }}</md-chip-template>
                </md-chips>
            </div>
        </md-dialog-content>
        <md-dialog-actions layout="row">
            <span flex></span>
            <md-button ng-click="cancel()">{{ 'Cancel' | translate }}</md-button>
            <md-button ng-click="invite()" ng-disabled="clients.length === 0" type="submit" class="md-accent md-hue-3">
                {{ 'Invite' | translate }}
            </md-button>
        </md-dialog-actions>
    </form>
</md-dialog>
